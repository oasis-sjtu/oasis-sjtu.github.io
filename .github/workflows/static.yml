name: Deploy Flask App to GitHub Pages

on:
  push:
    branches:
      - master  # Set this to your default branch
  schedule:
    - cron: '0 18 * * *'  # Daily at 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, and the Playwright system
    # dependencies are not guaranteed to install there. Bump deliberately after testing.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      # static/dataset_metrics.json is not committed with data, so keep the last good
      # download counts in the Actions cache. Without this, a failed Tianchi scrape would
      # silently drop every count from the published site.
      - name: Restore Dataset Metrics Cache
        uses: actions/cache@v6
        with:
          path: static/dataset_metrics.json
          key: dataset-metrics-${{ github.run_id }}
          restore-keys: |
            dataset-metrics-

      # Download counts are a nice-to-have: never block publishing the site on them. That
      # includes installing Playwright and Chromium, which is why it happens in this step.
      - name: Update Dataset Metrics
        continue-on-error: true
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/update_dataset_metrics.py

      # Fail the build instead of publishing a site with unparseable author lists or
      # papers whose local PDF is missing.
      - name: Validate Publication Data
        run: |
          python scripts/manage_publication_pdfs.py --validate

      - name: Generate Static Files
        run: |
          python freeze.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
